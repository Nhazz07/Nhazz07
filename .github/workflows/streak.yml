name: Update GitHub Streak

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Pull latest changes
        run: |
          git pull --rebase origin main

      - name: Test GitHub token
        env:
          GH_PAT: ${{ secrets.STREAK_TOKEN }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "❌ STREAK_TOKEN is empty or missing."
            exit 1
          fi

          echo "✅ STREAK_TOKEN exists."

          RESPONSE=$(curl \
            -s \
            -o /tmp/github-response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)

          echo "GitHub API status: $RESPONSE"

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Token authentication failed."
            cat /tmp/github-response.json
            exit 1
          fi

          echo "✅ Token authentication works."

      - name: Generate streak SVG
        env:
          GH_PAT: ${{ secrets.STREAK_TOKEN }}
          GITHUB_USERNAME: Nhazz07
        run: |
          python generate_streak.py

      - name: Commit updated streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub contribution streak"
            git push origin main
          fi
